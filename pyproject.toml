[project]
name = "keepvoice"
version = "0.1.1"
description = "Remove music from a video, including songs with singing, and keep the speech."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yabloko Labs" }]
keywords = ["audio", "video", "music removal", "source separation", "demucs", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "demucs>=4.0.1",
    "numpy",
    "soundfile",
    "torch>=2.0",
    "torchaudio>=2.0",
]

[project.urls]
Homepage = "https://github.com/yablokolabs/keepvoice"
Documentation = "https://github.com/yablokolabs/keepvoice/blob/main/docs/how-it-works.md"
Issues = "https://github.com/yablokolabs/keepvoice/issues"

[project.scripts]
keepvoice = "keepvoice.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/keepvoice", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the real separation model (downloads checkpoints)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
